<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;background:#0b0c11;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;overflow:hidden}

</style></head><body><div class="bg"></div><div class="grid"></div>
