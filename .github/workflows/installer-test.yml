name: Installer test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'src/Glint/Glint.csproj'
      - 'src/Glint/Core/Updater.cs'
      - '.github/workflows/installer-test.yml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
jobs:
  installer-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/Glint/Glint.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o out/publish
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version 6.4.3 -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=0.0.1" "/DPublishDir=..\out\publish" installer\glint.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Silent install (no PawnIO, no WebView2 download, no SignalRGB step)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process out\Glint-Setup-0.0.1.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCANCEL', '/LOG=install-log.txt', '/TASKS=desktopicon' -Wait -PassThru
          if (Test-Path install-log.txt) { Get-Content install-log.txt -Tail 40 }
          $h = Join-Path $env:TEMP 'glint-setup-helper.log'
          if (Test-Path $h) { '--- helper log ---'; Get-Content $h }
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
      - name: Setup logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path install-log.txt) { Get-Content install-log.txt -Tail 60 }
          $h = Join-Path $env:TEMP 'glint-setup-helper.log'
          if (Test-Path $h) { '--- helper log ---'; Get-Content $h }
      - name: Check install
        shell: pwsh
        run: |
          $d = Join-Path $env:ProgramFiles 'Glint'
          foreach ($f in 'Glint.exe', 'WebView2Loader.dll', 'ClearScriptV8.win-x64.dll', 'selftest.ps1', 'LICENSE', 'NOTICE.md', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $d $f))) { throw "missing $f" }
          }
          if (-not (Test-Path (Join-Path $d 'web\index.html'))) { throw 'missing web\index.html' }
          foreach ($t in 'Glint', 'Glint selftest') {
            $task = Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue
            if (-not $task) { throw "scheduled task '$t' missing" }
          }
          $t = Get-ScheduledTask -TaskName 'Glint'
          if ($t.Principal.RunLevel -ne 'Highest') { throw 'Glint task is not elevated' }
          if ($t.Settings.ExecutionTimeLimit -ne 'PT0S') { throw "unexpected time limit $($t.Settings.ExecutionTimeLimit)" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Glint.lnk")) { throw 'start menu shortcut missing' }
          $p = Start-Process (Join-Path $d 'Glint.exe') -ArgumentList 'selftest', "$PWD\selftest-installed.json" -Wait -PassThru -NoNewWindow -WorkingDirectory $d
          if ($p.ExitCode -ne 0) { Get-Content selftest-installed.json; throw 'selftest from install dir failed' }
      - name: Silent upgrade (the same setup again, run the way Glint's one-click update runs it)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $d = Join-Path $env:ProgramFiles 'Glint'
          $lnk = Join-Path $env:PUBLIC 'Desktop\Glint.lnk'
          if (-not (Test-Path $lnk)) { throw 'desktop shortcut (task chosen at install) missing before the upgrade' }
          # same switches as Updater.SetupArgs: no /TASKS, so the previous choices are kept
          $p = Start-Process out\Glint-Setup-0.0.1.exe -ArgumentList '/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOCANCEL', '/MERGETASKS=!disablesignalrgb', '/LOG=upgrade-log.txt' -Wait -PassThru
          if (Test-Path upgrade-log.txt) { Get-Content upgrade-log.txt -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "upgrade exit code $($p.ExitCode)" }
          foreach ($f in 'Glint.exe', 'WebView2Loader.dll', 'ClearScriptV8.win-x64.dll', 'selftest.ps1', 'helper.ps1', 'unins000.exe', 'web\index.html') {
            if (-not (Test-Path (Join-Path $d $f))) { throw "missing $f after the upgrade" }
          }
          foreach ($t in 'Glint', 'Glint selftest') {
            if (-not (Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue)) { throw "scheduled task '$t' missing after the upgrade" }
          }
          $t = Get-ScheduledTask -TaskName 'Glint'
          if ($t.Principal.RunLevel -ne 'Highest') { throw 'Glint task is not elevated after the upgrade' }
          if ($t.Actions[0].Execute -ne (Join-Path $d 'Glint.exe')) { throw "Glint task points at $($t.Actions[0].Execute)" }
          if (-not (Test-Path $lnk)) { throw 'the upgrade dropped the desktop shortcut (previous tasks not kept)' }
          $log = Get-Content upgrade-log.txt -Raw
          # Glint must come back by itself: the "Start Glint now" postinstall entry has to run in silent mode
          if ($log -notmatch 'schtasks\.exe[\s\S]{0,200}/run /tn "Glint"') { throw 'the silent upgrade did not run the "Start Glint now" entry' }
          if ($log -match '-Action SignalRgb') { throw 'the SignalRGB step ran during an upgrade' }
          Start-Sleep 5
          if (Get-Process Glint -ErrorAction SilentlyContinue) { 'Glint is running again after the upgrade' } else { 'note: Glint process not seen (runner session); the setup log shows the start entry ran' }
          $p = Start-Process (Join-Path $d 'Glint.exe') -ArgumentList 'selftest', "$PWD\selftest-upgraded.json" -Wait -PassThru -NoNewWindow -WorkingDirectory $d
          if ($p.ExitCode -ne 0) { Get-Content selftest-upgraded.json; throw 'selftest after the upgrade failed' }
      - name: Silent uninstall
        shell: pwsh
        run: |
          $d = Join-Path $env:ProgramFiles 'Glint'
          $p = Start-Process (Join-Path $d 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit code $($p.ExitCode)" }
          Start-Sleep 3
      - name: Check cleanup
        shell: pwsh
        run: |
          $d = Join-Path $env:ProgramFiles 'Glint'
          if (Test-Path (Join-Path $d 'Glint.exe')) { throw 'Glint.exe still installed' }
          foreach ($t in 'Glint', 'Glint selftest') {
            if (Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue) { throw "scheduled task '$t' still present" }
          }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Glint.lnk") { throw 'start menu shortcut still present' }
